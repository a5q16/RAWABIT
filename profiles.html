<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profiles — Rawabit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          sage: '#2C5F2D', 'sage-light': '#3A7D3E', 'sage-dark': '#1F4620',
          'sage-bright': '#8BC98F', 'sage-glow': '#A9DBAD',
          alabaster: '#F9F6F0',
          charcoal: '#141414', 'charcoal-light': '#1D1D1D', 'charcoal-lighter': '#2F2F2F'
        },
        fontFamily: { inter: ['Inter', 'sans-serif'], cairo: ['Cairo', 'sans-serif'] },
        animation: { 'fade-in': 'fadeIn 0.5s ease-out both' },
        keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
      } }
    };
  </script>

  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Inter', 'Cairo', sans-serif; background: #F9F6F0; color: #1a1a1a; transition: background .35s ease, color .35s ease; }
    html.dark body { background: #141414; color: #e8e8e8; }

    html.dark .text-sage { color: #8BC98F; }
    html.dark .hover\:text-sage:hover { color: #A9DBAD; }
    html.dark .dark\:border-gray-700 { border-color: #3D3D3D; }

    .nav-scrolled { background: rgba(249,246,240,.88); backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(0,0,0,.07); }
    html.dark .nav-scrolled { background: rgba(20,20,20,.88); box-shadow: 0 1px 0 rgba(255,255,255,.07); }
    .nav-link { display: inline-block; padding: .5rem 1rem; border-radius: .75rem; font-size: .875rem; font-weight: 500; color: #4b5563; text-decoration: none; transition: all .2s; }
    html.dark .nav-link { color: #d4d4d4; }
    .nav-link:hover { color: #2C5F2D; background: #eceae4; }
    html.dark .nav-link:hover { color: #A9DBAD; background: #2F2F2F; }
    .nav-link.active { color: #2C5F2D; background: rgba(44,95,45,.12); font-weight: 600; }
    html.dark .nav-link.active { color: #8BC98F; background: rgba(139,201,143,.12); }

    html:not(.dark) .icon-sun { display: none; }
    html.dark .icon-moon { display: none; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
     ::-webkit-scrollbar-thumb { background: #2C5F2D40; border-radius: 99px; }

    .lang-btn { padding: 6px 10px; border-radius: 9px; font-size: 12px; font-weight: 700; border: 1px solid transparent; background: transparent; color: #6b7280; cursor: pointer; transition: all .18s; }
    html.dark .lang-btn { color: #9ca3af; }
    .lang-btn:hover { background: #eceae4; color: #2C5F2D; }
    html.dark .lang-btn:hover { background: #2F2F2F; color: #A9DBAD; }
    .lang-btn.active { background: #2C5F2D; color: #fff; border-color: #2C5F2D; }
    html.dark .lang-btn.active { background: #8BC98F; color: #141414; border-color: #8BC98F; }
    #lang-switcher { display:flex; align-items:center; gap:2px; background:#f3f4f6; border-radius:12px; padding:3px; }
    html.dark #lang-switcher { background:#2F2F2F; }

    /* ── Loading screen (auto-hides via CSS even if JS fails) ── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #F9F6F0;
      animation: loaderFade .4s ease .7s forwards;
    }
    html.dark #loading-screen { background: #141414; }
    @keyframes loaderFade { to { opacity: 0; visibility: hidden; } }
    .loader-dot {
      display: inline-block; width: 10px; height: 10px;
      margin: 0 4px; border-radius: 50%; background: #2C5F2D;
      animation: loaderBounce 1.4s ease-in-out infinite both;
    }
    html.dark .loader-dot { background: #8BC98F; }
    .loader-dot:nth-child(1) { animation-delay: -0.32s; }
    .loader-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes loaderBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>

  <!-- ═══ LOADING SCREEN ═══ -->
  <div id="loading-screen">
    <div class="dark:text-sage-bright" style="margin-bottom:16px;font-family:'Cairo',sans-serif;font-size:24px;font-weight:700;color:#2C5F2D;">روابط</div>
    <div>
      <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
    </div>
  </div>

  <!-- ═══ NAVBAR ═══ -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3 group no-underline">
          <div class="w-9 h-9 rounded-xl bg-sage flex items-center justify-center text-white font-cairo font-bold text-lg transition-transform group-hover:scale-105">ر</div>
          <div class="flex flex-col leading-none">
            <span class="font-cairo font-bold text-lg text-charcoal dark:text-alabaster">روابط</span>
            <span class="text-[10px] uppercase tracking-widest text-sage dark:text-sage-bright font-inter font-medium mt-0.5">Rawabit</span>
          </div>
        </a>

        <div class="hidden md:flex items-center gap-1">
          <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
          <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
          <a href="why.html" class="nav-link" data-i18n="nav.why">Why & Vision</a>
          <a href="contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
        </div>

        <div class="flex items-center gap-3">
          <div id="lang-switcher" role="group" aria-label="Language">
            <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
            <button class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
            <button class="lang-btn" data-lang="ar" aria-pressed="false">ع</button>
          </div>
          <button id="theme-toggle" aria-label="Toggle theme"
            class="w-9 h-9 rounded-xl flex items-center justify-center bg-gray-100 dark:bg-charcoal-lighter text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button id="menu-toggle" aria-label="Menu"
            class="md:hidden w-9 h-9 rounded-xl flex items-center justify-center bg-gray-100 dark:bg-charcoal-lighter text-gray-600 dark:text-gray-300">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-200/60 dark:border-neutral-700 mt-2 pt-3 flex flex-col gap-2">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
        <a href="why.html" class="nav-link" data-i18n="nav.why">Why & Vision</a>
        <a href="contact.html" class="nav-link" data-i18n="nav.contact">Contact</a>
      </div>
    </div>
  </nav>

  <!-- ═══ PROFILES PAGE ═══ -->
  <section class="pt-28 pb-20 px-4 animate-fade-in">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-10">
        <h1 data-i18n="profiles.title" class="text-3xl md:text-4xl font-bold text-charcoal dark:text-alabaster font-inter mb-3">Competency Profiles</h1>
        <p data-i18n="profiles.subtitle" class="text-base text-gray-600 dark:text-gray-300 font-inter max-w-lg mx-auto">Verified profiles structured with academic, professional, and reliability data.</p>
      </div>

      <div id="profiles-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </div>
  </section>

  <!-- ═══ FOOTER ═══ -->
  <footer class="border-t border-gray-200 dark:border-neutral-700 py-12 px-4 mt-8">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-sage flex items-center justify-center text-white font-cairo font-bold text-sm">ر</div>
        <span class="font-cairo font-bold text-charcoal dark:text-alabaster">روابط</span>
        <span class="text-[10px] uppercase tracking-widest text-sage dark:text-sage-bright font-inter">Rawabit</span>
      </div>
      <div class="flex items-center gap-6 text-sm text-gray-500 dark:text-gray-400 font-inter">
        <a href="about.html" data-i18n="footer.about" class="hover:text-sage dark:hover:text-sage-bright transition no-underline">About</a>
        <a href="why.html" data-i18n="footer.why" class="hover:text-sage dark:hover:text-sage-bright transition no-underline">Why & Vision</a>
        <a href="contact.html" data-i18n="footer.contact" class="hover:text-sage dark:hover:text-sage-bright transition no-underline">Contact</a>
      </div>
      <p data-i18n="footer.copy" class="text-xs text-gray-400 dark:text-gray-500 font-inter m-0">© 2025 Rawabit — المنصة الرقمية للكفاءات الجزائرية</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/chat-widget.js"></script>
  <script>
    rawabitInitNav();

    (function () {
      var grid = document.getElementById('profiles-grid');
      var esc = RAWABIT.escapeHtml;
      function t(k){ return (window.RAWABIT_I18N ? RAWABIT_I18N.t(k) : k); }
      function render(){
      var cards = RAWABIT.profiles.map(function (p) {
        var verified = p.reliability >= 90
          ? '<span class="inline-flex items-center gap-1.5 mt-2 px-3 py-1 rounded-full bg-sage/10 text-sage dark:text-sage-bright text-xs font-bold w-fit border border-sage/20 shadow-xs">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' + p.reliability + '% ' + t('card.verified') + '</span>'
          : '';

        var academic = p.academic.slice(0, 2).map(function (a) {
          return '<div class="flex items-start gap-2.5">' +
                   '<div class="mt-1.5 w-2 h-2 rounded-full bg-sage flex-shrink-0"></div>' +
                   '<div><p class="text-sm font-medium text-charcoal dark:text-gray-100 m-0">' + esc(a.degree) + '</p>' +
                   '<p class="text-xs text-gray-500 dark:text-gray-400 m-0">' + esc(a.institution) + ' · ' + esc(a.year) + '</p></div>' +
                 '</div>';
        }).join('');

        var skills = p.skills.map(function (s) {
          return '<div><div class="flex justify-between items-center mb-1">' +
                   '<span class="text-xs text-gray-600 dark:text-gray-300 font-inter">' + esc(s.name) + '</span>' +
                   '<span class="text-[10px] text-gray-400">' + s.level + '%</span></div>' +
                   '<div class="h-1.5 bg-gray-100 dark:bg-charcoal-lighter rounded-full overflow-hidden">' +
                   '<div class="h-full bg-sage rounded-full" style="width:' + s.level + '%"></div></div></div>';
        }).join('');

        var tags = p.tags.map(function (t) {
          return '<span class="px-3 py-1 text-xs font-medium rounded-full bg-sage/10 text-sage dark:text-sage-bright border border-sage/15">#' + esc(t) + '</span>';
        }).join('');

        return '' +
        '<a href="profile.html?id=' + p.id + '" class="group block bg-white dark:bg-charcoal-light rounded-3xl border border-gray-200 dark:border-neutral-600 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 hover:border-sage/40 transition-all duration-300 no-underline">' +
          '<div class="h-1.5 bg-gradient-to-r from-sage via-sage-light to-sage-glow opacity-80"></div>' +
          '<div class="p-5 flex items-center gap-4">' +
            '<img src="' + p.avatar + '" alt="' + esc(p.name) + '" loading="lazy" ' +
              'class="w-20 h-20 rounded-2xl object-cover ring-2 ring-white dark:ring-charcoal-lighter shadow-sm flex-shrink-0 bg-alabaster dark:bg-charcoal-lighter" ' +
              'onerror="this.src=\'https://api.dicebear.com/8.x/initials/svg?seed=' + encodeURIComponent(p.name) + '&backgroundColor=2C5F2D&textColor=ffffff\'" />' +
            '<div class="min-w-0">' +
              '<h3 class="font-semibold text-base text-charcoal dark:text-alabaster truncate font-inter m-0">' + esc(p.name) + '</h3>' +
              '<p class="text-xs text-gray-500 dark:text-gray-400 font-cairo m-0">' + esc(p.nameAr) + '</p>' +
              '<p class="text-sm text-sage dark:text-sage-bright font-medium mt-0.5 truncate m-0">' + esc(p.title) + '</p>' +
              verified +
              '<div class="flex items-center gap-1 mt-1 text-gray-500 dark:text-gray-400">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                '<span class="text-xs">' + esc(p.location) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="grid grid-cols-3 gap-px bg-gray-100 dark:bg-neutral-700">' +
            '<div class="col-span-2 bg-white dark:bg-charcoal-light p-5">' +
              '<h4 class="text-[11px] uppercase tracking-wider text-sage dark:text-sage-bright font-semibold m-0 mb-3">' + t('card.academic') + '</h4>' +
              '<div class="space-y-2.5">' + academic + '</div>' +
            '</div>' +
            '<div class="col-span-1 bg-white dark:bg-charcoal-light p-5">' +
              '<h4 class="text-[11px] uppercase tracking-wider text-sage dark:text-sage-bright font-semibold m-0 mb-3">' + t('card.reliability') + '</h4>' +
              '<div class="flex flex-col items-start">' +
                '<span class="text-3xl font-bold text-sage dark:text-sage-bright font-inter">' + p.reliability + '%</span>' +
                '<span class="text-[10px] uppercase tracking-wide text-gray-400 font-semibold mt-1">' +
                  (p.reliability >= 90 ? t('card.high') : p.reliability >= 75 ? t('card.moderate') : t('card.unverified')) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="bg-white dark:bg-charcoal-light px-5 py-4 border-t border-gray-100 dark:border-neutral-700">' +
            '<h4 class="text-[11px] uppercase tracking-wider text-sage dark:text-sage-bright font-semibold m-0 mb-3">' + t('card.skills') + '</h4>' +
            '<div class="space-y-2.5">' + skills + '</div>' +
          '</div>' +

          '<div class="bg-white dark:bg-charcoal-light px-5 pb-3 pt-1 flex flex-wrap gap-2">' + tags + '</div>' +

          '<div class="bg-white dark:bg-charcoal-light px-5 pb-4 pt-1">' +
            '<div class="flex items-center justify-end gap-1.5 text-xs font-semibold text-sage dark:text-sage-bright opacity-70 group-hover:opacity-100 transition-opacity">' +
              '<span>' + t('card.viewProfile') + '</span><span aria-hidden="true">→</span>' +
            '</div>' +
          '</div>' +
        '</a>';
      });

      grid.innerHTML = cards.join('');
      }
      render();
      window.addEventListener('rawabit-lang-change', render);
    })();
  </script>
  <script src="js/onboarding.js"></script>
</body>
</html>
