  <!-- Prevent FOUC: set lang/dir early from localStorage or browser detection -->
  <script>
    (function() {
      try {
        var lang = localStorage.getItem('rawabit-lang');
        if (!lang) {
          var navLang = (navigator.languages && navigator.languages.length > 0)
            ? navigator.languages[0].slice(0, 2)
            : (navigator.language || 'ar').slice(0, 2);
          lang = (navLang === 'fr' || navLang === 'en') ? navLang : 'ar';
        }
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } else if (lang === 'fr') {
          document.documentElement.lang = 'fr';
          document.documentElement.dir = 'ltr';
        } else {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch(e) {}
    })();
  </script>
