<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rawabit — Algeria's Digital Competencies Platform. Discover, explore, and connect with verified Algerian professionals." />
  <title>روابط — Rawabit</title>

  <!-- Tajawal Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/overlays.css" />
  <link rel="stylesheet" href="css/transitions.css" />

  <!-- Prevent FOUC: set lang/dir early from localStorage -->
  <script>
    (function() {
      try {
        var lang = localStorage.getItem('rawabit-lang');
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        } else if (lang === 'fr') {
          document.documentElement.lang = 'fr';
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <!-- Main Content Container (populated by router) -->
  <main id="main-content"></main>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
